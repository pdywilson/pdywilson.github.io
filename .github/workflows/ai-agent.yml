name: Free AI Coding Agent

on:
  issue_comment:
    types: [created]

jobs:
  run-aider:
    # ONLY run if YOU (pdywilson) comment "@agent <task>" on an Issue
    if: |
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@agent') &&
      github.actor == 'pdywilson'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: pip install aider-chat

      - name: Run Aider & Open PR
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure Git Bot Identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Combine Issue Context (Title + Description + Comment)
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_BODY="${{ github.event.issue.body }}"
          RAW_COMMENT="${{ github.event.comment.body }}"
          
          # Remove '@agent' trigger word from comment
          CLEAN_COMMENT=$(echo "$RAW_COMMENT" | sed 's/@agent//g')

          # Build combined prompt passed to Aider
          FULL_PROMPT="Task Title: $ISSUE_TITLE. Task Details/Description: $ISSUE_BODY. Additional Instruction: $CLEAN_COMMENT"

          # Run Aider with Gemini
          aider --model gemini --message "$FULL_PROMPT" --yes --no-auto-commits

          # ONLY create a branch and PR if Aider actually edited files
          if [ -n "$(git status --porcelain)" ]; then
            BRANCH_NAME="ai-fix-issue-${{ github.event.issue.number }}-${{ github.run_id }}"
            git checkout -b $BRANCH_NAME
            git add .
            git commit -m "AI update for Issue #${{ github.event.issue.number }}"
            git push origin $BRANCH_NAME

            gh pr create \
              --title "AI Fix for Issue #${{ github.event.issue.number }}" \
              --body "Automated PR generated by Aider via Gemini API." \
              --base main \
              --head $BRANCH_NAME
          else
            echo "No changes made by Aider. Skipping PR creation."
          fi
