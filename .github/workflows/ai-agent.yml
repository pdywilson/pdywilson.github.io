name: Free AI Coding Agent

on:
  issue_comment:
    types: [created]

jobs:
  run-aider:
    # Triggers whenever someone comments "@agent <task>" on a GitHub Issue
    if: github.event.issue.pull_request == null && contains(github.event.comment.body, '@agent')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: pip install aider-chat

      - name: Run Aider & Open PR
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure Git Bot Identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Extract prompt text after '@agent'
          RAW_PROMPT="${{ github.event.comment.body }}"
          CLEAN_PROMPT=$(echo "$RAW_PROMPT" | sed 's/@agent//g')

          # Create a new feature branch
          BRANCH_NAME="ai-fix-issue-${{ github.event.issue.number }}-${{ github.run_id }}"
          git checkout -b $BRANCH_NAME

          # Run Aider with Gemini 2.5 Flash/Pro (Free tier)
          aider --model gemini/gemini-2.5-flash --message "$CLEAN_PROMPT" --yes --no-auto-commits

          # Push changes and open Pull Request if code was edited
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "AI update for Issue #${{ github.event.issue.number }}"
            git push origin $BRANCH_NAME

            gh pr create \
              --title "AI Fix for Issue #${{ github.event.issue.number }}" \
              --body "Automated PR generated by Aider via Gemini API." \
              --base main \
              --head $BRANCH_NAME
          fi
